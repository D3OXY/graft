[workspace]
members = [
    "crates/graft-core",
    "crates/graft-sync",
    "crates/graft-cli",
    "crates/graft-hub",
    "crates/graft-e2e",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/deoxycode/graft"

[workspace.dependencies]
graft-core = { path = "crates/graft-core" }
graft-sync = { path = "crates/graft-sync" }
blake3 = "1.8.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
thiserror = "2.0.17"

[profile.release]
lto = "thin"
codegen-units = 1
