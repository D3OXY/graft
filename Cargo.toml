[workspace]
members = [
    "crates/graft-core",
    "crates/graft-sync",
    "crates/graft-cli",
    "crates/graft-hub",
    "crates/graft-e2e",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/deoxycode/graft"

[workspace.dependencies]
age = { version = "0.12.1", default-features = false }
ed25519-dalek = { version = "2.2.0", default-features = true }
graft-core = { path = "crates/graft-core" }
graft-sync = { path = "crates/graft-sync" }
blake3 = "1.8.2"
rand = "0.9.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
zeroize = { version = "1.8.2", features = ["derive"] }
zstd = "0.13.3"

[profile.release]
lto = "thin"
codegen-units = 1
